### LlamaFactory DPO 训练配置（LoRA）
### 使用方法: cd LlamaFactory && llamafactory-cli train ../configs/llamafactory_dpo_lora.yaml

### ========== 模型配置 ==========
model_name_or_path: ../models/student  # 基础模型路径（Qwen2.5-1.5B）
adapter_name_or_path: ../models/model_c_sft  # SFT 训练后的 LoRA 权重
template: qwen

### ========== 微调方法 ==========
stage: dpo
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

### ========== 数据集配置 ==========
dataset: autoif_dpo  # 需要在 LlamaFactory/data/dataset_info.json 中配置
dataset_dir: ../configs  # 指向包含 llama_factory_dataset_info.json 的目录
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16

### ========== 输出配置 ==========
output_dir: ../models/model_c_dpo
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

### ========== 训练超参数 ==========
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
fp16: true

### ========== DPO 特定参数 ==========
pref_beta: 0.1
pref_loss: sigmoid

### ========== 其他配置 ==========
ddp_timeout: 180000000
report_to: tensorboard
