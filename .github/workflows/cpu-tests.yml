name: cpu-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: CPU validators, TLR, EnvIF-Bench
        run: |
          python tests/test_env_validators.py
          python tests/test_envif_tlr.py
          python tests/test_envif_bench.py
          python scripts/eval_envif_bench.py --oracle --tag ci_oracle
          python scripts/build_experiment_summary.py
